<svg width="850" height="180" viewBox="0 0 850 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f" />
      <stop offset="100%" stop-color="#11131a" />
    </linearGradient>

    <!-- Subtle Accent Glow -->
    <radialGradient id="glow" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="50%" stop-color="#3f3f46" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>

    <!-- Subtle Decorative Lines Gradient -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: "SF Mono", "Fira Code", "JetBrains Mono", Menlo, Consolas, monospace;
    }
  </style>

  <!-- Container Box -->
  <rect width="850" height="180" rx="10" fill="url(#bg)" stroke="url(#border-grad)" stroke-width="1.2" />
  <rect width="850" height="180" rx="10" fill="url(#glow)" />

  <!-- Subtle Minimal Right Abstract Accent -->
  <g opacity="0.35" transform="translate(620, 20)">
    <circle cx="120" cy="70" r="90" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 6" fill="none" opacity="0.4" />
    <circle cx="120" cy="70" r="60" stroke="#818cf8" stroke-width="1" fill="none" opacity="0.3" />
    <circle cx="120" cy="70" r="30" stroke="#a855f7" stroke-width="1" stroke-dasharray="2 4" fill="none" opacity="0.25" />
    <line x1="20" y1="70" x2="200" y2="70" stroke="#52525b" stroke-width="0.8" stroke-dasharray="4 4" />
  </g>

  <!-- Content Group -->
  <g transform="translate(56, 45)">
    <!-- Small Category / Status -->
    <g transform="translate(0, 5)">
      <circle cx="4" cy="4" r="3" fill="#38bdf8" />
      <text x="16" y="7.5" fill="#38bdf8" font-size="11" font-weight="600" letter-spacing="1.5" class="font-mono">PORTFOLIO &amp; SYSTEMS</text>
    </g>

    <!-- Name Heading -->
    <text x="0" y="52" fill="#f8fafc" font-size="34" font-weight="700" letter-spacing="0.5" class="font-sans">Hari Nath</text>

    <!-- Clean Professional Title -->
    <text x="0" y="80" fill="#94a3b8" font-size="15" font-weight="400" letter-spacing="0.2" class="font-sans">AI &amp; Systems Developer · Android &amp; Edge Engineering</text>
  </g>
</svg>
