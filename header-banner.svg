<svg width="850" height="230" viewBox="0 0 850 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.6" />
    </linearGradient>

    <radialGradient id="glow-cyan" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-purple" cx="85%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .mono { font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; }
    .display { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background Canvas -->
  <rect width="850" height="230" rx="16" fill="url(#bg-grad)" />
  <rect width="850" height="230" rx="16" fill="url(#glow-cyan)" />
  <rect width="850" height="230" rx="16" fill="url(#glow-purple)" />
  <rect x="1" y="1" width="848" height="228" rx="15" stroke="url(#border-grad)" stroke-width="1.5" fill="none" />

  <!-- Grid Decoration Lines -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="230" />
    <line x1="150" y1="0" x2="150" y2="230" />
    <line x1="700" y1="0" x2="700" y2="230" />
    <line x1="800" y1="0" x2="800" y2="230" />
    <line x1="0" y1="60" x2="850" y2="60" />
    <line x1="0" y1="170" x2="850" y2="170" />
  </g>

  <!-- Status Chip (Top Right) -->
  <g transform="translate(640, 24)">
    <rect width="170" height="28" rx="14" fill="#0f172a" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="16" cy="14" r="4.5" fill="#22c55e" />
    <text x="28" y="18" fill="#86efac" font-size="11.5" font-weight="600" class="mono" letter-spacing="0.5">OPEN TO COLLAB</text>
  </g>

  <!-- Category Tag (Top Left) -->
  <g transform="translate(42, 28)">
    <rect width="260" height="24" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
    <text x="12" y="16.5" fill="#38bdf8" font-size="11" font-weight="600" class="mono" letter-spacing="0.6">AI &amp; DATA SCIENCE • QIS CET</text>
  </g>

  <!-- Main Hero Name -->
  <text x="42" y="112" fill="url(#name-grad)" font-size="46" font-weight="800" class="display" letter-spacing="-0.8">Hari Nath</text>
  <text x="260" y="98" fill="#64748b" font-size="16" font-weight="500" class="mono">/ harinath4496</text>

  <!-- Subtitle / Focus -->
  <text x="44" y="146" fill="#f1f5f9" font-size="16.5" font-weight="600" class="display">
    Autonomous AI Systems <tspan fill="#38bdf8">•</tspan> Edge Neural Inference <tspan fill="#38bdf8">•</tspan> Native Android (Compose)
  </text>

  <!-- Secondary Line: Accolades -->
  <g transform="translate(44, 172)">
    <!-- SIH Badge -->
    <rect x="0" y="0" width="230" height="26" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-opacity="0.5" stroke-width="1" />
    <text x="10" y="17" fill="#a5b4fc" font-size="12" font-weight="600" class="mono">🏆 SIH 2026 Finalist • iTantra</text>

    <!-- Aegis Badge -->
    <rect x="240" y="0" width="220" height="26" rx="6" fill="#064e3b" stroke="#10b981" stroke-opacity="0.5" stroke-width="1" />
    <text x="250" y="17" fill="#6ee7b7" font-size="12" font-weight="600" class="mono">🛡️ Project Aegis Lead</text>

    <!-- QIS Cortex Badge -->
    <rect x="470" y="0" width="180" height="26" rx="6" fill="#172554" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1" />
    <text x="480" y="17" fill="#93c5fd" font-size="12" font-weight="600" class="mono">📱 QIS CORTEX &amp; Irah</text>
  </g>

  <!-- Decorative Neural Node Diagram (Far Right) -->
  <g transform="translate(730, 85)" opacity="0.8">
    <line x1="20" y1="20" x2="60" y2="40" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.5" />
    <line x1="20" y1="60" x2="60" y2="40" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" />
    <line x1="60" y1="40" x2="90" y2="20" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.5" />
    <line x1="60" y1="40" x2="90" y2="60" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.5" />

    <circle cx="20" cy="20" r="5" fill="#38bdf8" />
    <circle cx="20" cy="60" r="5" fill="#6366f1" />
    <circle cx="60" cy="40" r="7" fill="#818cf8" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="90" cy="20" r="5" fill="#c084fc" />
    <circle cx="90" cy="60" r="5" fill="#06b6d4" />
  </g>
</svg>
