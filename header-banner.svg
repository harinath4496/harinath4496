<svg width="850" height="200" viewBox="0 0 850 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .mono { font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>

  <!-- Background Card -->
  <rect width="850" height="200" rx="12" fill="#09090b" stroke="#27272a" stroke-width="1.5" />

  <!-- Subtle Dot Grid Pattern -->
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="0.75" fill="#3f3f46" opacity="0.5" />
  </pattern>
  <rect x="1" y="1" width="848" height="198" rx="11" fill="url(#grid)" />

  <!-- Corner Crosshairs (Architectural / Minimalist) -->
  <path d="M 28 20 L 28 32 M 22 26 L 34 26" stroke="#52525b" stroke-width="1" />
  <path d="M 822 20 L 822 32 M 816 26 L 828 26" stroke="#52525b" stroke-width="1" />
  <path d="M 28 168 L 28 180 M 22 174 L 34 174" stroke="#52525b" stroke-width="1" />
  <path d="M 822 168 L 822 180 M 816 174 L 828 174" stroke="#52525b" stroke-width="1" />

  <!-- Top Status -->
  <g transform="translate(56, 38)">
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
    <circle cx="0" cy="0" r="6.5" stroke="#71717a" stroke-width="1" opacity="0.6" />
    <text x="16" y="3.5" fill="#a1a1aa" font-size="10.5" font-weight="500" letter-spacing="2" class="mono">SYSTEMS · ON-DEVICE NEURAL · ANDROID</text>
  </g>

  <!-- Main Name -->
  <text x="56" y="100" fill="#ffffff" font-size="36" font-weight="700" letter-spacing="1.5" class="sans">HARI NATH</text>

  <!-- Subtitle Tagline -->
  <text x="56" y="132" fill="#a1a1aa" font-size="13.5" font-weight="400" letter-spacing="0.5" class="sans">Engineering edge AI, speech transceivers, and native Android applications.</text>

  <!-- Coordinates & Identity -->
  <text x="56" y="168" fill="#52525b" font-size="10" font-weight="500" letter-spacing="1.5" class="mono">QIS CET // AI &amp; DATA SCIENCE // 15.5057° N, 80.0499° E</text>

  <!-- Minimalist Right-Side Technical Signal Graphic -->
  <g transform="translate(680, 50)" stroke="#71717a" stroke-width="1.2" opacity="0.65">
    <line x1="0" y1="50" x2="110" y2="50" stroke="#3f3f46" stroke-dasharray="2 3" />
    <path d="M 10 50 Q 25 15, 35 50 T 60 50 T 85 50 T 110 50" fill="none" stroke="#e4e4e7" stroke-width="1.2" />
    <path d="M 10 50 Q 25 75, 40 50 T 70 50 T 100 50" fill="none" stroke="#71717a" stroke-width="1" stroke-dasharray="4 2" />
    <circle cx="35" cy="50" r="2.5" fill="#ffffff" />
    <circle cx="85" cy="50" r="2.5" fill="#ffffff" />
    <text x="25" y="88" fill="#52525b" font-size="9" letter-spacing="2" class="mono" text-anchor="middle">SIGNAL · RF</text>
    <text x="85" y="88" fill="#52525b" font-size="9" letter-spacing="2" class="mono" text-anchor="middle">NEURAL</text>
  </g>
</svg>